{{- $name := printf "%s-secrets" (include "tappet.fullname" .) -}}
{{- if or (not .Values.encryptionKey.existingSecret) (and .Values.database.url (not .Values.database.existingSecret)) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "tappet.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if not .Values.encryptionKey.existingSecret }}
  {{- if .Values.encryptionKey.value }}
  ENCRYPTION_KEY: {{ .Values.encryptionKey.value | b64enc | quote }}
  {{- else if and $existing (index $existing.data "ENCRYPTION_KEY") }}
  ENCRYPTION_KEY: {{ index $existing.data "ENCRYPTION_KEY" | quote }}
  {{- else }}
  ENCRYPTION_KEY: {{ randAlphaNum 32 | b64enc | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- if and .Values.database.url (not .Values.database.existingSecret) }}
  DATABASE_URL: {{ .Values.database.url | b64enc | quote }}
  {{- end }}
{{- end }}
